placeholder: true
vision:
  fr: '[PLACEHOLDER] Un Québec où chaque culture se sent chez elle et où la diversité est vécue comme une richesse partagée.'
  en: '[PLACEHOLDER] A Québec where every culture feels at home and diversity is experienced as a shared wealth.'
  fa: '[PLACEHOLDER] کبکی که در آن هر فرهنگی احساس کند در خانه خویش است و تنوع، ثروتی مشترک به شمار آید.'
values:
  - icon: dialogue
    title: { fr: 'Dialogue', en: 'Dialogue', fa: 'گفت‌وگو' }
    text:
      fr: 'Écouter, se raconter et apprendre les uns des autres.'
      en: 'Listening, sharing our stories and learning from one another.'
      fa: 'گوش دادن، روایت کردن و آموختن از یکدیگر.'
  - icon: respect
    title: { fr: 'Respect', en: 'Respect', fa: 'احترام' }
    text:
      fr: 'Accueillir chaque personne avec dignité, dans toute sa singularité.'
      en: 'Welcoming every person with dignity, in all their uniqueness.'
      fa: 'پذیرفتن هر انسان با کرامت و با همه ویژگی‌های یگانه‌اش.'
  - icon: openness
    title: { fr: 'Ouverture', en: 'Openness', fa: 'گشودگی' }
    text:
      fr: "Cultiver la curiosité et la découverte de l'autre."
      en: 'Nurturing curiosity and discovery of others.'
      fa: 'پرورش کنجکاوی و شوق شناختن دیگری.'
  - icon: creativity
    title: { fr: 'Créativité', en: 'Creativity', fa: 'خلاقیت' }
    text:
      fr: "Faire de l'art et de la culture des ponts entre les gens."
      en: 'Making art and culture into bridges between people.'
      fa: 'هنر و فرهنگ را به پل‌هایی میان مردم بدل کردن.'
  - icon: community
    title: { fr: 'Communauté', en: 'Community', fa: 'همبستگی اجتماعی' }
    text:
      fr: 'Bâtir ensemble des liens durables, ici, à Montréal.'
      en: 'Building lasting connections together, here in Montréal.'
      fa: 'ساختن پیوندهای ماندگار با هم، همین‌جا در مونترال.'
  - icon: equity
    title: { fr: 'Équité', en: 'Equity', fa: 'برابری' }
    text:
      fr: 'Rendre nos activités accessibles au plus grand nombre.'
      en: 'Making our activities accessible to as many people as possible.'
      fa: 'دسترس‌پذیر کردن فعالیت‌هایمان برای هرچه بیشتر مردم.'
